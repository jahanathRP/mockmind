{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 3rem auto;">
    <div class="card">
        <h2 style="margin-bottom: 2rem; color: var(--dark-color); text-align: center;">Interview Setup</h2>
        
        <form method="POST" action="{{ url_for('interview.setup') }}">
            <div class="form-group">
                <label for="category" class="form-label">Interview Category</label>
                <select id="category" name="category" class="form-control" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="HR">HR</option>
                    <option value="Java">Java</option>
                    <option value="DSA">Data Structures & Algorithms (DSA)</option>
                    <option value="Machine Learning">Machine Learning</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="difficulty" class="form-label">Difficulty Level</label>
                <select id="difficulty" name="difficulty" class="form-control" required>
                    <option value="" disabled selected>Select Difficulty</option>
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>

            <div class="form-group">
                <label for="num_questions" class="form-label">Number of Questions</label>
                <select id="num_questions" name="num_questions" class="form-control" required>
                    <option value="1">1 (Quick Test)</option>
                    <option value="2">2 (Short Practice)</option>
                    <option value="3" selected>3</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                </select>
                <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">Note: Max number depends on available questions in DB.</small>
            </div>
            
            <div style="margin-top: 3rem; text-align: center;">
                <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 1rem;">Start Interview</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
